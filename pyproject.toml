[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vr-treadmill"
version = "0.1.0"
description = "Mouse treadmill to virtual Xbox 360 controller input for Windows VR games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.0",
  "pystray>=0.19.5",
  "pynput>=1.8.2",
  "vgamepad @ git+https://github.com/yannbouteiller/vgamepad@v0.1.3 ; platform_system == 'Windows'",
]

[project.scripts]
vrtread-cli = "vrtread.cli:main"
vrtread-gui = "vrtread.gui:main"

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
