name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        shell: pwsh
        run: .\scripts\build-exe.ps1

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: VRTreadmill-exe
          path: dist/VRTreadmill.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VRTreadmill-installer
          path: dist/VRTreadmill-Setup.exe
          if-no-files-found: error

      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release delete latest --yes --cleanup-tag 2>$null || $true
          $notes = @"
          Latest automated Windows build from main.

          Recommended download:
          - VRTreadmill-Setup.exe

          Portable option:
          - VRTreadmill.exe

          ViGEmBus is still required for virtual Xbox controller support. If the app says the driver is missing, use the Driver section in the app to open the official driver download page.
          "@
          gh release create latest `
            dist/VRTreadmill-Setup.exe `
            dist/VRTreadmill.exe `
            --target "${{ github.sha }}" `
            --title "Latest VR Treadmill build" `
            --notes $notes `
            --prerelease
